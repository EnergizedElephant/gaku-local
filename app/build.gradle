plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {

    namespace 'ca.fuwafuwa.gaku'
    compileSdk 34

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }

    // This fork's versions start at 2.0.0 (Gaku was 1.3.78); versionCode follows from them
    def version = [2, 0, 0]
    defaultConfig {
        // Its own ID, so it installs alongside Kaku's and Gaku's ca.fuwafuwa.* instead of clashing
        applicationId "io.github.energizedelephant.gaku"
        minSdkVersion 24
        targetSdk 34
        versionCode version[0] * 10000 + version[1] * 100 + version[2]
        versionName version.join('.')
    }

    // Stored uncompressed so the manga-ocr model can be memory-mapped from the APK instead of copied
    androidResources {
        noCompress += ['onnx']
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    // offline has no network permission at all. lan can also ask an Ollama server on the local network
    // to translate or explain the text (BuildConfig.LLM); both share one applicationId, so either
    // installs over the other.
    flavorDimensions 'network'
    productFlavors {
        offline {
            dimension 'network'
            buildConfigField 'boolean', 'LLM', 'false'
        }
        lan {
            dimension 'network'
            versionNameSuffix '-lan'
            buildConfigField 'boolean', 'LLM', 'true'
        }
    }

    buildTypes {
        release {
            debuggable false
            // Drops unused library code and every Log.d (see proguard-rules.pro)
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // 64-bit ARM only. Build with -Px86_64 to try a release on the emulator
            ndk {
                abiFilters 'arm64-v8a'
                if (project.hasProperty('x86_64')) abiFilters 'x86_64'
            }
        }
        debug {
            debuggable true
            // x86_64 for the emulator too. Each native library (ML Kit, ONNX Runtime) would otherwise
            // ship for four ABIs
            ndk {
                abiFilters 'arm64-v8a', 'x86_64'
            }
        }
    }
    packagingOptions {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE', 'META-INF/LICENSE.txt', 'META-INF/license.txt', 'META-INF/NOTICE', 'META-INF/NOTICE.txt', 'META-INF/notice.txt', 'META-INF/ASL2.0', 'META-INF/CONTRIBUTORS.md', 'META-INF/LICENSE.md']
        }
    }


    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    implementation 'com.google.mlkit:text-recognition-japanese:16.0.1'
    // Runs the manga-ocr model, the default reader (tools/fetch_manga_ocr.sh), on the device only
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.30.0'
    implementation 'com.google.guava:guava:31.0.1-android'
    implementation 'com.google.code.gson:gson:2.8.9'
    implementation 'androidx.appcompat:appcompat:1.4.1'
    implementation 'com.google.android.material:material:1.6.0'
    implementation 'com.j256.ormlite:ormlite-android:5.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.3'
    testImplementation 'junit:junit:4.13.2'
    // Only used by the tokenizer experiment in ExampleUnitTest
    testImplementation 'com.atilika.kuromoji:kuromoji-ipadic:0.9.0'
    // Probably just delete all these was trying to get GenerateDictionary to work as a Unit Test
    testImplementation 'com.j256.ormlite:ormlite-core:5.1'
    testImplementation 'com.j256.ormlite:ormlite-jdbc:5.1'
    testImplementation 'org.xerial:sqlite-jdbc:3.25.2'
    testImplementation 'xmlpull:xmlpull:1.1.3.1'
    testImplementation 'kxml2:kxml2:2.3.0'
}
